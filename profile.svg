
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="620"
  viewBox="0 0 1000 620"
>

<style>

  .bg {
    fill: #0d1117;
  }

  .terminal {
    fill: #161b22;
    stroke: #30363d;
    stroke-width: 2;
  }

  text {
    font-family:
      ui-monospace,
      SFMono-Regular,
      Menlo,
      Monaco,
      Consolas,
      "Liberation Mono",
      "Courier New",
      monospace;

    font-size: 21px;
  }

  .normal {
    fill: #c9d1d9;
  }

  .green {
    fill: #3fb950;
  }

  .blue {
    fill: #58a6ff;
  }

  .muted {
    fill: #8b949e;
  }

  .typing {
    opacity: 0;

    animation:
      show 0.01s forwards,
      type var(--duration) steps(var(--chars), end) forwards;

    animation-delay:
      var(--delay),
      var(--delay);
  }

  @keyframes show {
    to {
      opacity: 1;
    }
  }

  @keyframes type {
    from {
      clip-path: inset(0 100% 0 0);
    }

    to {
      clip-path: inset(0 0 0 0);
    }
  }

  .cursor {
    opacity: 0;
    fill: #3fb950;

    animation:
      cursor-show 0.01s forwards,
      blink 0.8s step-end infinite;

    animation-delay:
      13.889999999999999s,
      13.889999999999999s;
  }

  @keyframes cursor-show {
    to {
      opacity: 1;
    }
  }

  @keyframes blink {
    50% {
      opacity: 0;
    }
  }

</style>


<!-- Background -->
<rect
  class="bg"
  width="1000"
  height="620"
  rx="18"
/>


<!-- Terminal -->
<rect
  class="terminal"
  x="20"
  y="20"
  width="960"
  height="580"
  rx="14"
/>


<!-- Window controls -->
<circle cx="55" cy="50" r="7" fill="#ff5f56"/>
<circle cx="80" cy="50" r="7" fill="#ffbd2e"/>
<circle cx="105" cy="50" r="7" fill="#27c93f"/>


<!-- Title -->
<text
  x="140"
  y="58"
  class="muted"
>
  borjan@github: ~/profile
</text>



    <text
